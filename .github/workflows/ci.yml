name: HW4 CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required files exist
        run: |
          for f in memory/bm25.py memory/store.py memory/core.py memory/cli.py \
                   tests/test_memory.py benchmark/run_benchmark.py \
                   README.md REPORT.md requirements.txt; do
            test -f "$f" || { echo "::error::missing required file: $f"; exit 1; }
          done

      - name: Ensure no secrets committed
        run: if [ -f .env ]; then echo "::error::.env must not be committed"; exit 1; fi

      - name: Install
        run: pip install -r requirements.txt

      - name: Public unit tests
        run: pytest -q

      - name: Benchmark smoke run
        run: python benchmark/run_benchmark.py --k 5
